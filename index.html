<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="英语学习">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111d33">
  <title>英语学习台 · 听力 &amp; 听写</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #0f1b33;
      --muted: #5a6a85;
      --line: #e2e8f2;
      --accent: #1d6bf3;
      --accent-soft: #eaf2ff;
      --teal: #0f8a78;
      --teal-soft: #e6f6f3;
      --shadow: 0 12px 32px rgba(17, 33, 63, 0.07);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { touch-action: manipulation; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top left, #eef4ff 0%, var(--bg) 50%, #f7f9fc 100%);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .wrap {
      width: 100%;
      max-width: 780px;
    }
    .hero {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      height: clamp(190px, 30vh, 260px);
      margin-bottom: 18px;
      box-shadow: 0 16px 40px rgba(15, 27, 51, 0.14);
      background: #141c2e;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      display: block;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 20, 38, 0.08) 20%, rgba(12, 20, 38, 0.78) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px 22px;
      color: #fff;
    }
    .hero-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      margin-bottom: 4px;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(22px, 5vw, 28px);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .hero p {
      margin: 6px 0 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(17, 33, 63, 0.10);
      border-color: #c5d6f5;
    }
    .card:active {
      transform: scale(0.99);
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .badge {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      flex-shrink: 0;
    }
    .badge.listen { background: linear-gradient(135deg, #111d33, #0f8a78); }
    .badge.vocab { background: linear-gradient(135deg, #11213f, #2254b8); }
    .card h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -0.01em;
    }
    .card small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
      font-size: 12.5px;
    }
    .stats {
      font-size: 12.5px;
      color: var(--muted);
      padding-top: 12px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .cta {
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .cta.teal {
      color: var(--teal);
    }
    .footer {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px;
    }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #16a34a;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <img src="./cover.jpg" alt="英语学习台封面">
      <div class="hero-overlay">
        <div class="hero-eyebrow">ENGLISH STUDIO</div>
        <h1>今天练哪一项？</h1>
        <p>选择一个模块开始，训练页内随时可返回切换</p>
      </div>
    </header>

    <div class="grid">
      <a class="card" href="./listening/">
        <div class="card-top">
          <div class="badge listen">◢</div>
          <div>
            <h2>英语听力训练台</h2>
            <small>53 套真题 · 1 · 2 · 7 三步精听与错题本</small>
          </div>
        </div>
        <div class="stats">
          <span id="listen-meta">正在读取进度…</span>
          <span class="cta teal">进入听力 →</span>
        </div>
      </a>

      <a class="card" href="./vocab/">
        <div class="card-top">
          <div class="badge vocab">W</div>
          <div>
            <h2>词汇听写台</h2>
            <small>1,750 词 · 35 天计划 · 五词听写与复习</small>
          </div>
        </div>
        <div class="stats">
          <span id="vocab-meta">正在读取进度…</span>
          <span class="cta">进入听写 →</span>
        </div>
      </a>
    </div>

    <div class="footer">
      <div id="studio-status"><span class="dot"></span>进度自动保存</div>
      <div id="studio-hint">可添加到手机主屏幕使用</div>
    </div>
  </div>

  <script>
    const STAGE_SHORT = {
      d1: 'Day 1 首练',
      d2blind: 'Day 2 盲听',
      review: 'Day 2 精听',
      d2verify: 'Day 2 验证',
      d2: 'Day 2 回听',
      d7: 'Day 7 复测',
    };
    const todayLocal = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Australia/Sydney',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    }).format(new Date());

    async function renderStaticFallback() {
      document.getElementById('studio-status').innerHTML =
        '<span class="dot"></span>进度保存在当前浏览器';
      document.getElementById('studio-hint').textContent =
        '可添加到手机主屏幕 · 建议定期导出备份';

      let vp = null;
      try { vp = JSON.parse(localStorage.getItem('vocab-listening-lab-v1') || 'null'); } catch {}
      if (!vp) {
        try { vp = (await (await fetch('./vocab/seed-progress.json', { cache: 'no-store' })).json())?.progress; } catch {}
      }
      if (vp) {
        const done = new Set([...(vp.completedGroups || []).filter(id => id <= 12), ...(vp.dailyCompletedGroups || [])]).size;
        document.getElementById('vocab-meta').textContent =
          `Day ${vp.selectedGroup || 1} · 已完成 ${done} 天 · ${Object.keys(vp.records || {}).length} 词`;
      } else {
        document.getElementById('vocab-meta').textContent = '准备就绪';
      }

      let lp = null;
      try { lp = JSON.parse(localStorage.getItem('listening-desk-progress-v1') || 'null'); } catch {}
      if (!lp) {
        try { lp = (await (await fetch('./listening/seed-progress.json', { cache: 'no-store' })).json())?.progress; } catch {}
      }
      if (lp) {
        const total = (lp.units || []).length + (lp.legacy || []).length;
        const dt = lp.dailyTask;
        const doneToday = dt && dt.date === todayLocal && dt.completed;
        document.getElementById('listen-meta').textContent =
          `共 ${total} 批 · ${doneToday ? '今日已完成' : '今日有待办'}`;
      } else {
        document.getElementById('listen-meta').textContent = '准备就绪';
      }
    }

    fetch('./api/summary', { cache: 'no-store' })
      .then(r => {
        if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) throw new Error('static');
        return r.json();
      })
      .then(d => {
        if (!d?.ok) throw new Error('static');
        document.getElementById('studio-status').innerHTML =
          '<span class="dot"></span>本地持久化服务运行中';
        document.getElementById('studio-hint').textContent =
          '进度实时写入本机磁盘 data/';
        if (d.vocab) {
          document.getElementById('vocab-meta').textContent =
            `Day ${d.vocab.selectedGroup} · 已完成 ${d.vocab.completedDays} 天 · ${d.vocab.recordedWords} 词`;
        }
        if (d.listening) {
          const dt = d.listening.dailyTask;
          const total = d.listening.totalBatches ?? (d.listening.units + d.listening.legacyBatches);
          const isToday = dt && dt.date === (d.today || todayLocal);
          let status = '今日有待办';
          if (isToday && dt.completed) {
            status = '今日已完成';
          } else if (isToday) {
            const st = STAGE_SHORT[d.listening.todayStage || dt.kind] || '待办';
            status = `批次 ${d.listening.todayBatch} · ${st}`;
          }
          document.getElementById('listen-meta').textContent =
            `共 ${total} 批 · ${status}`;
        }
      })
      .catch(renderStaticFallback);
  </script>
</body>
</html>
